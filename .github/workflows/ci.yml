name: CI

# El sitio no tenia ninguna comprobacion: un error de Jekyll o un enlace roto se veia en
# produccion. Esto construye el sitio en cada push y falla si el build revienta o si las
# paginas que el perfil enlaza no existen.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Construir el sitio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Instalar Jekyll y el tema
        run: gem install 'jekyll:~>4.3' minima
      - name: Construir
        run: jekyll build --trace
      - name: Las paginas que el perfil enlaza existen
        run: |
          for ruta in index.html method/index.html requirements/index.html engineering/index.html about/index.html; do
            test -f "_site/$ruta" || { echo "::error::falta _site/$ruta"; exit 1; }
          done
      - name: Los productos publicados existen
        run: |
          test -f "_site/volt-typhoon-actor-profile/index.html"
          test -f "_site/scattered-spider-actor-profile/index.html"
          test -f "_site/ach-voltzite-volt-typhoon/index.html"
          test -f "_site/from-source-to-a-defensible-judgement/index.html"
          test -f "_site/sylvanite-access-layer/index.html"
          test -f "_site/grandoreiro-actor-profile/index.html"
          test -f "_site/hunts/sylvanite-handoff.json"

      - name: Las tablas generadas se renderizan como tablas
        run: |
          for ruta in scattered-spider-actor-profile volt-typhoon-actor-profile ach-voltzite-volt-typhoon sylvanite-access-layer grandoreiro-actor-profile; do
            grep -q "<table" "_site/$ruta/index.html" || { echo "::error::$ruta no tiene tabla"; exit 1; }
            if grep -q "| Assessment | Confidence" "_site/$ruta/index.html"; then
              echo "::error::$ruta publicó su tabla como texto (marcador HTML suelto)"; exit 1
            fi
          done
