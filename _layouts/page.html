---
layout: default
---
<article class="page">
  <div class="wrap page-wrap">
    <header class="page-head">
      <p class="kicker"><span class="kicker-rule" aria-hidden="true"></span>{{ page.kicker | default: "Reference" }}</p>
      <h1 class="page-title">{{ page.title }}</h1>
      {% if page.description %}<p class="page-lede">{{ page.description }}</p>{% endif %}
    </header>
    <div class="post-body">
      {{ content }}
    </div>
  </div>
</article>
